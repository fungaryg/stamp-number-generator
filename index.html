<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印章生成器 - Control Copy Stamp Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1a1a22;
            color: #eee;
            min-height: 100vh;
            display: flex;
        }

        .panel {
            width: 320px;
            background: #2a2a32;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
            height: 100vh;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .section-label {
            font-size: 10px;
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .field-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        input[type="text"] {
            background: #1e1e24;
            border: 1px solid #3a3a45;
            border-radius: 6px;
            padding: 10px 14px;
            color: #eee;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #d92b2b;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-row label {
            font-size: 13px;
            color: #bbb;
            width: 70px;
            flex-shrink: 0;
        }

        .slider-row .value {
            font-size: 12px;
            font-weight: bold;
            color: #d92b2b;
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            background: #3a3a45;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #d92b2b;
            border-radius: 50%;
            cursor: pointer;
        }

        .spacer {
            flex: 1;
        }

        .export-btn {
            background: #d92b2b;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background: #e63939;
        }

        .export-btn:active {
            background: #b82222;
        }

        .preview-area {
            flex: 1;
            background: #f5f1e8;
            margin: 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .panel {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="title">印章生成器</div>
        <div class="subtitle">CONTROL COPY Stamp Tool</div>

        <div class="field-label">文件编号</div>
        <input type="text" id="number" value="8" placeholder="输入数字编号" maxlength="4">

        <div class="section-label">样式调节</div>

        <div class="slider-row">
            <label>上行字号</label>
            <input type="range" id="fontTop" min="30" max="70" value="56">
            <span class="value" id="fontTopVal">56</span>
        </div>

        <div class="slider-row">
            <label>边框粗细</label>
            <input type="range" id="border" min="8" max="30" value="18">
            <span class="value" id="borderVal">18</span>
        </div>

        <div class="slider-row">
            <label>倾斜角度</label>
            <input type="range" id="angle" min="-20" max="20" value="-5">
            <span class="value" id="angleVal">-5°</span>
        </div>

        <div class="slider-row">
            <label>做旧程度</label>
            <input type="range" id="grain" min="0" max="100" value="60">
            <span class="value" id="grainVal">60%</span>
        </div>

        <div class="slider-row">
            <label>下行字号</label>
            <input type="range" id="fontBottom" min="30" max="80" value="70">
            <span class="value" id="fontBottomVal">70</span>
        </div>

        <div class="spacer"></div>

        <button class="export-btn" onclick="exportPNG()">导出 PNG</button>
    </div>

    <div class="preview-area">
        <canvas id="stampCanvas" width="900" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('stampCanvas');
        const ctx = canvas.getContext('2d');
        const STAMP_COLOR = '#dc1e1e';
        let grainSeed = null;
        let grainPoints = [];

        function getParams() {
            return {
                number: document.getElementById('number').value || '1',
                fontTop: parseInt(document.getElementById('fontTop').value),
                fontBottom: parseInt(document.getElementById('fontBottom').value),
                border: parseInt(document.getElementById('border').value),
                angle: parseInt(document.getElementById('angle').value),
                grain: parseInt(document.getElementById('grain').value) / 100
            };
        }

        function updateLabels() {
            const p = getParams();
            document.getElementById('fontTopVal').textContent = p.fontTop;
            document.getElementById('borderVal').textContent = p.border;
            document.getElementById('angleVal').textContent = p.angle + '°';
            document.getElementById('grainVal').textContent = Math.round(p.grain * 100) + '%';
            document.getElementById('fontBottomVal').textContent = p.fontBottom;
        }

        function ensureGrain(grainLevel) {
            const seedKey = Math.round(grainLevel * 100);
            if (grainSeed === seedKey && grainPoints.length > 0) return;
            grainPoints = [];
            const sw = 520, sh = 280;
            const sx = (600 - sw) / 2, sy = (350 - sh) / 2;
            const numPoints = Math.floor(600 * 350 * grainLevel * 0.02);
            for (let i = 0; i < numPoints; i++) {
                grainPoints.push({
                    x: sx + Math.random() * sw,
                    y: sy + Math.random() * sh,
                    alpha: 30 + Math.random() * 120,
                    size: 1 + Math.random() * 1.5
                });
            }
            grainSeed = seedKey;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
        }

        function drawStamp() {
            const p = getParams();
            updateLabels();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0,0,0,0.06)';
            ctx.lineWidth = 1;
            for (let y = 40; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(40, y);
                ctx.lineTo(canvas.width - 40, y);
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(p.angle * Math.PI / 180);

            const sw = 520, sh = 280;
            const x = -sw / 2, y = -sh / 2;

            ctx.strokeStyle = STAMP_COLOR;
            ctx.lineWidth = p.border;
            ctx.beginPath();
            roundRect(ctx, x, y, sw, sh, 24);
            ctx.stroke();

            ctx.fillStyle = STAMP_COLOR;
            ctx.font = `bold ${p.fontTop}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('CONTROL COPY', 0, y + 70);

            ctx.font = `bold ${p.fontBottom}px Arial`;
            ctx.fillText(`No. ${p.number}`, 0, y + 180);

            if (p.grain > 0) {
                ensureGrain(p.grain);
                ctx.globalCompositeOperation = 'destination-out';
                grainPoints.forEach(pt => {
                    ctx.beginPath();
                    ctx.arc(pt.x - sw/2, pt.y - sh/2, pt.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0,0,0,${pt.alpha / 255})`;
                    ctx.fill();
                });
                ctx.globalCompositeOperation = 'source-over';
            }

            ctx.restore();
        }

        function exportPNG() {
            const p = getParams();
            const exportCanvas = document.createElement('canvas');
            const scale = 2;
            exportCanvas.width = 1200 * scale;
            exportCanvas.height = 700 * scale;
            const ectx = exportCanvas.getContext('2d');

            ectx.scale(scale, scale);
            ectx.translate(600, 350);
            ectx.rotate(p.angle * Math.PI / 180);

            const sw = 520, sh = 280;
            const x = -sw / 2, y = -sh / 2;

            ectx.strokeStyle = STAMP_COLOR;
            ectx.lineWidth = p.border;
            ectx.beginPath();
            roundRect(ectx, x, y, sw, sh, 24);
            ectx.stroke();

            ectx.fillStyle = STAMP_COLOR;
            ectx.font = `bold ${p.fontTop}px Arial`;
            ectx.textAlign = 'center';
            ectx.textBaseline = 'middle';
            ectx.fillText('CONTROL COPY', 0, y + 70);

            ectx.font = `bold ${p.fontBottom}px Arial`;
            ectx.fillText(`No. ${p.number}`, 0, y + 180);

            if (p.grain > 0) {
                ensureGrain(p.grain);
                ectx.globalCompositeOperation = 'destination-out';
                grainPoints.forEach(pt => {
                    ectx.beginPath();
                    ectx.arc(pt.x - sw/2, pt.y - sh/2, pt.size, 0, Math.PI * 2);
                    ectx.fillStyle = `rgba(0,0,0,${pt.alpha / 255})`;
                    ectx.fill();
                });
            }

            const link = document.createElement('a');
            link.download = `CONTROL_COPY_No_${p.number}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', drawStamp);
        });

        document.getElementById('number').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        drawStamp();
    </script>
</body>
</html>
